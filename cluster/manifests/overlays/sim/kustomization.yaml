# Sim: node 2 only, and the llm-d inference simulator (v0.11.2) in place of vLLM in both engine pods.
# Gate G0 uses it to test full admission control + routing (edge, guard, Agent Router, llm-d router, sidecar)
# in minutes, before any model download. The guard models and SIE still use the node 2 GPUs.
# The simulator takes the vLLM flags for KV events and replay. VERIFY at G0 that it binds tcp://*:5556.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../t2]
patches:
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: DaemonSet
      metadata: {name: lmcache-server, namespace: companion}
  - target: {kind: Deployment, name: vllm-prefill}
    patch: |-
      - {op: replace, path: /spec/template/spec/nodeSelector, value: {companion.io/node: control}}
      - {op: replace, path: /spec/template/spec/containers/0/image, value: "ghcr.io/llm-d/llm-d-inference-sim:v0.11.2"}
      - {op: replace, path: /spec/template/spec/containers/0/command, value: [/app/llm-d-inference-sim]}
      - op: replace
        path: /spec/template/spec/containers/0/args
        value: [--model=companion, --served-model-name=companion, --port=8000, --max-num-seqs=8, --max-model-len=32768,
                --mode=random, --time-to-first-token=300ms, --inter-token-latency=20ms, --enable-kvcache,
                --kv-cache-size=2048, --block-size=64, "--zmq-endpoint=tcp://*:5556",
                "--kv-events-replay-endpoint=tcp://*:5559"]
      - {op: replace, path: /spec/template/spec/containers/0/resources, value: {requests: {cpu: 500m, memory: 512Mi}, limits: {memory: 2Gi}}}
  - target: {kind: Deployment, name: vllm-decode}
    patch: |-
      - {op: replace, path: /spec/template/spec/nodeSelector, value: {companion.io/node: control}}
      - {op: replace, path: /spec/template/spec/containers/0/image, value: "ghcr.io/llm-d/llm-d-inference-sim:v0.11.2"}
      - {op: replace, path: /spec/template/spec/containers/0/command, value: [/app/llm-d-inference-sim]}
      - op: replace
        path: /spec/template/spec/containers/0/args
        value: [--model=companion, --served-model-name=companion, --port=8200, --max-num-seqs=24, --max-model-len=32768,
                --mode=random, --time-to-first-token=150ms, --inter-token-latency=20ms,
                --kv-cache-transfer-latency=100ms, --enable-kvcache, --kv-cache-size=4096, --block-size=64,
                "--zmq-endpoint=tcp://*:5556", "--kv-events-replay-endpoint=tcp://*:5559"]
      - {op: replace, path: /spec/template/spec/containers/0/resources, value: {requests: {cpu: 500m, memory: 512Mi}, limits: {memory: 2Gi}}}
