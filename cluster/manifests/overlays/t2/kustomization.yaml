# T2: node 1 = 2 x H100 SXM (engine), node 2 = 2 x A6000 or 1 x H100 (control, data, guard). Versions: cluster/versions.env.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
images:
  - {name: VLLM_IMAGE, newName: vllm/vllm-openai, newTag: v0.30.0}
  - {name: LLMD_ROUTING_SIDECAR_IMAGE, newName: ghcr.io/llm-d/llm-d-router-disagg-sidecar, newTag: v0.11.0}
  - {name: REDIS_IMAGE, newName: redis, newTag: 8.2-alpine}
  - {name: QDRANT_IMAGE, newName: qdrant/qdrant, newTag: v1.19.1}
  - {name: SIE_EMBED_IMAGE, newName: ghcr.io/superlinked/sie-server, newTag: v0.8.3-cuda12-default}
  - {name: SIE_OCR_IMAGE, newName: ghcr.io/superlinked/sie-server, newTag: v0.8.3-cuda12-sglang-vision-extract}
  - {name: NGINX_IMAGE, newName: nginx, newTag: 1.29-alpine}
patches:
  - target: {kind: Deployment, name: vllm-prefill}
    patch: |-
      - {op: replace, path: /spec/template/spec/containers/0/env/0/value, value: RedHatAI/gemma-4-31B-it-FP8-dynamic}
  - target: {kind: Deployment, name: vllm-decode}
    patch: |-
      - {op: replace, path: /spec/template/spec/containers/0/env/0/value, value: RedHatAI/gemma-4-31B-it-FP8-dynamic}
  - target: {kind: Deployment, name: guard-injection}
    patch: |-
      - {op: replace, path: /spec/template/spec/containers/0/env/0/value, value: meta-llama/Llama-Prompt-Guard-2-86M}  # A8 done 2026-09-27
