# Prefill pool (system design section 3). One full H100, TP 1. Role label for the llm-d prefill filter.
apiVersion: apps/v1
kind: Deployment
metadata: {name: vllm-prefill, namespace: companion}
spec:
  replicas: 1
  strategy: {type: Recreate}         # one GPU for each pod: a rolling update waits for a GPU that never frees
  selector: {matchLabels: {app: vllm-prefill}}
  template:
    metadata:
      # hami.io/webhook=ignore: node 1 has the NVIDIA device plugin, not HAMi. Without it, the HAMi webhook
      # sends a new engine pod to the HAMi scheduler, and the pod stays Pending (session 1, fault 24).
      labels: {app: vllm-prefill, app.kubernetes.io/part-of: companion-vllm, llm-d.ai/role: prefill, hami.io/webhook: ignore}
    spec:
      nodeSelector: {companion.io/node: gpu}
      hostIPC: true
      terminationGracePeriodSeconds: 60
      containers:
        - name: modelserver
          image: VLLM_IMAGE
          command: ["vllm", "serve"]
          args:
            - $(MODEL)
            - --served-model-name=companion
            - --port=8200                   # the store barrier takes 8000 (session 1)
            - --max-model-len=32768
            - --max-num-seqs=8
            - --max-num-batched-tokens=16384
            - --block-size=64
            - --enable-prefix-caching
            - --scheduling-policy=priority
            - --gpu-memory-utilization=0.90
            - --no-disable-hybrid-kv-cache-manager
            - --enable-prompt-tokens-details
            - --enable-auto-tool-choice
            - --tool-call-parser=gemma4
            - --reasoning-parser=gemma4
            - '--limit-mm-per-prompt={"image":2}'
            - --disable-access-log-for-endpoints=/health,/metrics,/v1/models
            # G0 (2026-09-28): the P/D hop goes through the shared LMCache CPU tier (sidecar shared-storage).
            # NIXL between two pods on one node ran over TCP (4.9 s for 5.5K tokens; this path: 0.9 s).
            - --kv-transfer-config
            - '{"kv_connector":"LMCacheMPConnector","kv_role":"kv_both","kv_connector_extra_config":{"lmcache.mp.host":"tcp://$(HOST_IP)","lmcache.mp.port":5555,"lmcache.mp.isolated_ipc":true}}'
            - --kv-events-config
            - '{"enable_kv_cache_events":true,"publisher":"zmq","endpoint":"tcp://*:5556","replay_endpoint":"tcp://*:5559","topic":"kv@$(POD_IP):8000@$(MODEL)"}'
          env:
            - {name: MODEL, value: MAIN_MODEL}
            - {name: HF_TOKEN, valueFrom: {secretKeyRef: {name: companion-secrets, key: HF_TOKEN}}}
            - {name: POD_IP, valueFrom: {fieldRef: {fieldPath: status.podIP}}}
            - {name: HOST_IP, valueFrom: {fieldRef: {fieldPath: status.hostIP}}}
            - {name: VLLM_NIXL_SIDE_CHANNEL_HOST, valueFrom: {fieldRef: {fieldPath: status.podIP}}}
            - {name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE, value: "120"}
            - {name: PYTHONHASHSEED, value: "123"}
            - {name: UCX_TLS, value: "cuda_ipc,cuda_copy,tcp"}
            - {name: HF_HOME, value: /models/hf}
            - {name: VLLM_CACHE_ROOT, value: /models/vllm-cache}
          ports:
            - {name: http, containerPort: 8200}
            - {name: kv-events, containerPort: 5556}
            - {name: kv-replay, containerPort: 5559}   # the router asks for missed events (vLLM default: off)
            - {name: nixl, containerPort: 5600}
          resources:
            limits: {nvidia.com/gpu: "1", memory: 96Gi}
            requests: {nvidia.com/gpu: "1", cpu: "12", memory: 64Gi}
          startupProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10, failureThreshold: 180}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10, failureThreshold: 3}
          readinessProbe: {httpGet: {path: /v1/models, port: http}, periodSeconds: 5, failureThreshold: 3}
          volumeMounts:
            - {name: shm, mountPath: /dev/shm}
            - {name: models, mountPath: /models}
        # Session 1 (2026-09-29): the prefill engine answers before LMCache has stored the KV, so the decode
        # lookup missed and the decode pod computed the prompt again. The barrier holds the prefill leg of the
        # sidecar until the store is visible (control/barrier/proxy.py). The router and the sidecar use 8000.
        - name: store-barrier
          image: companion/edge:dev      # has control/; built on node 1 by cluster/t2.sh images
          imagePullPolicy: Never
          command: ["python", "-m", "control.barrier.proxy"]
          env:
            - {name: HOST_IP, valueFrom: {fieldRef: {fieldPath: status.hostIP}}}
            - {name: BARRIER_LISTEN_PORT, value: "8000"}
            - {name: BARRIER_UPSTREAM, value: "http://127.0.0.1:8200"}
            - {name: BARRIER_LMCACHE_METRICS, value: "http://$(HOST_IP):8080/metrics"}   # "" turns it off
            - {name: BARRIER_MIN_S, value: "0.1"}
            - {name: BARRIER_MAX_S, value: "0.5"}
          ports: [{name: barrier, containerPort: 8000}]
          resources:
            requests: {cpu: 500m, memory: 256Mi}
            limits: {memory: 1Gi}
          readinessProbe: {httpGet: {path: /barrier/health, port: barrier}, periodSeconds: 5}
      volumes:
        - {name: shm, emptyDir: {medium: Memory, sizeLimit: 20Gi}}
        - {name: models, hostPath: {path: /lambda/nfs/companion-state/models, type: DirectoryOrCreate}}
