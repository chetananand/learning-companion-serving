[project]
name = "learning-companion-serving"
version = "0.1.0"
description = "Learning companion over Notion bookmarks, served on a vLLM P/D cluster with llm-d"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "prometheus-client>=0.20",
    "redis>=5.0",
    "pyyaml>=6.0",
    "tldextract>=5.1",
    "tokenizers>=0.20",
]

[dependency-groups]
app = [
    "deepagents>=0.7.19,<0.8",
    "langchain>=1.4.2,<2",
    "langchain-core>=1.6.5,<2",
    "langchain-openai>=1.6.6,<2",
    "langgraph>=1.2.12,<2",
    "msgpack>=1.1,<2",
    "pypdf>=6,<7",
    "pyzmq>=26,<28",
    "qdrant-client>=1.19.1,<2",
    "trafilatura>=2.2.0,<3",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "fakeredis>=2.23",
    "ruff>=0.6",
]
notebook = [
    "ipykernel>=6.29,<8",
    "matplotlib>=3.10,<4",
    "nbclient>=0.10,<1",
    "nbformat>=5.10,<6",
]
ui = [
    "streamlit>=1.64,<2",
]

[tool.uv]
package = false
default-groups = ["dev", "app", "ui", "notebook"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["control", "app", "tools", "notebook"]
filterwarnings = ["ignore:Payload indexes have no effect:UserWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
