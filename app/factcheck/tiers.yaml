# Source tiers for the fact check (product spec section 6, rules 8 and 11).
# Tier 1: primary sources (official docs, repositories, release notes, standards, original papers).
# Tier 2: major publications and engineering blogs.
# Tier 3: forums and aggregators. Every unknown domain is tier 3.
# A host matches itself and all its subdomains.

