# The model's chat template adds the safety instructions, the taxonomy, and the output format.
# The prompt carries only the turns to classify. Do not add a system message.
# Source: examples/configs/nemotron-3.5-content-safety/prompts.yml (NeMo Guardrails v0.24.1).
prompts:
  - task: content_safety_check_input $model=content_safety
    messages:
      - type: user
        content: "{{ user_input }}"
    output_parser: nemotron_content_safety_parse_prompt_safety
    max_tokens: 100
    max_length: 128000

  - task: content_safety_check_output $model=content_safety
    messages:
      - type: user
        content: "{{ user_input }}"
      - type: assistant
        content: "{{ bot_response }}"
    output_parser: nemotron_content_safety_parse_response_safety
    max_tokens: 100
    max_length: 128000
